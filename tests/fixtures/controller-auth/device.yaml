# Public test configuration. The application-managed controller key takes precedence.
port: 7890
socks-port: 7891
mode: rule
secret: public-obsolete-subscription-key
proxies:
  - {name: Auth Direct, type: direct}
  - {name: Auth Reject, type: reject}
proxy-groups:
  - {name: Auth Group, type: select, proxies: [Auth Direct, Auth Reject]}
rules: ['MATCH,Auth Group']
